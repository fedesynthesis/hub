<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le mie app</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{display:flex;flex-direction:column;background:#111;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
  #frames{flex:1;position:relative;background:#fff}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .12s}
  iframe.on{opacity:1;pointer-events:auto}
  #bar{display:flex;background:#fdfcf8;border-top:1px solid #e2ded3;
    padding-bottom:env(safe-area-inset-bottom)}
  .tab{flex:1;border:none;background:none;cursor:pointer;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px}
  .tab .ic{width:38px;height:34px;border-radius:12px;display:grid;place-items:center;transition:background .15s}
  .tab .ic svg{width:22px;height:22px;fill:none;stroke:#a29a8c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
  .tab .lbl{font-size:11px;font-weight:600;color:#a29a8c}
  .tab.on .ic svg{stroke:#fff}
  .tab.on .lbl{color:#201c17}
  @media (prefers-color-scheme:dark){ #bar{background:#1b1b1e;border-top-color:#2c2c30} .tab .lbl{color:#8b8b90} .tab.on .lbl{color:#fff} }
</style>
</head>
<body>
  <div id="frames">
    <iframe id="f-tempo" title="TEMPO"></iframe>
    <iframe id="f-cicogna" title="Cicogna"></iframe>
    <iframe id="f-migross" title="Spesa Migross"></iframe>
  </div>
  <nav id="bar"></nav>
<script>
  var APPS=[
    {k:'tempo',name:'TEMPO',color:'#b8492c',url:'https://fedesynthesis.github.io/tempo/',
      icon:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 12.5l2.5 2.5L16 9"/>'},
    {k:'cicogna',name:'Cicogna',color:'#d8688a',url:'https://fedesynthesis.github.io/Cicogna2/',
      icon:'<path d="M12 20.5S4 15.5 4 9.8C4 7 6 5.3 8.2 5.3c1.6 0 3 .9 3.8 2.3.8-1.4 2.2-2.3 3.8-2.3C20 5.3 20 7 20 9.8c0 5.7-8 10.7-8 10.7z"/>'},
    {k:'migross',name:'Spesa',color:'#6b8f71',url:'https://fedesynthesis.github.io/migro/',
      icon:'<path d="M3 4h2.2l2 12h10.2l2-8.5H6.5"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/>'}
  ];
  var bar=document.getElementById('bar');
  bar.innerHTML=APPS.map(function(a){
    return '<button class="tab" data-k="'+a.k+'" aria-label="'+a.name+'">'
      +'<span class="ic"><svg viewBox="0 0 24 24">'+a.icon+'</svg></span>'
      +'<span class="lbl">'+a.name+'</span></button>';
  }).join('');
  function show(k){
    APPS.forEach(function(a){
      var f=document.getElementById('f-'+a.k), t=bar.querySelector('[data-k="'+a.k+'"]'), on=a.k===k;
      if(on && !f.src) f.src=a.url;                 // carica al primo accesso, poi resta (mantiene lo stato)
      f.classList.toggle('on',on);
      t.classList.toggle('on',on);
      t.querySelector('.ic').style.background = on ? a.color : 'transparent';
    });
  }
  bar.addEventListener('click',function(e){var b=e.target.closest('[data-k]'); if(b) show(b.dataset.k);});
  show('tempo');
</script>
</body>
</html>
