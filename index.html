<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub</title>
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hub">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f4f2ea">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#f4f2ea;color:#201c17;font-family:'Inter',system-ui,sans-serif;min-height:100vh;
    display:flex;justify-content:center;padding:calc(46px + env(safe-area-inset-top)) 20px 40px}
  .wrap{width:100%;max-width:440px}
  .eyebrow{font-family:'Fraunces',serif;font-style:italic;font-weight:500;color:#b8492c;font-size:17px}
  .h1{font-family:'Fraunces',serif;font-weight:400;font-size:40px;letter-spacing:-.01em;margin-top:2px}
  .tiles{margin-top:26px;display:flex;flex-direction:column;gap:14px}
  .tile{display:flex;align-items:center;gap:16px;background:#fdfcf8;border:1px solid #e4e0d6;border-radius:20px;
    padding:18px;text-decoration:none;color:inherit;box-shadow:0 8px 22px -18px rgba(30,25,20,.5);transition:transform .15s,box-shadow .15s}
  .tile:active{transform:scale(.985)}
  .ic{width:56px;height:56px;border-radius:16px;flex:none;display:grid;place-items:center;color:#fff}
  .ic svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .name{display:block;font-size:18px;font-weight:600;letter-spacing:-.01em}
  .sub{display:block;font-size:13.5px;color:#7a746b;margin-top:3px}
  .arw{margin-left:auto;color:#c3bcae}
  .arw svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .foot{margin-top:28px;text-align:center;font-size:12.5px;color:#a29a8c}
  @media (prefers-color-scheme:dark){
    body{background:#17150f;color:#efe9df}
    .tile{background:#22201a;border-color:#33302a}
    .sub{color:#a29a8c}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">le tue app</div>
    <div class="h1">Casa Fede</div>
    <div class="tiles" id="tiles"></div>
    <div class="foot">Tocca un'app per aprirla</div>
  </div>
<script>
  var APPS=[
    {name:'TEMPO',sub:'Task e calendario',color:'#b8492c',url:'https://fedesynthesis.github.io/tempo/',
      icon:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 12.5l2.5 2.5L16 9"/>'},
    {name:'Cicogna',sub:'Lista nascita',color:'#d8688a',url:'https://fedesynthesis.github.io/Cicogna2/',
      icon:'<path d="M12 20.5S4 15.5 4 9.8C4 7 6 5.3 8.2 5.3c1.6 0 3 .9 3.8 2.3.8-1.4 2.2-2.3 3.8-2.3C20 5.3 20 7 20 9.8c0 5.7-8 10.7-8 10.7z"/>'},
    {name:'Spesa Migross',sub:'Lista della spesa',color:'#6b8f71',url:'https://fedesynthesis.github.io/migro/',
      icon:'<path d="M3 4h2.2l2 12h10.2l2-8.5H6.5"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/>'}
  ];
  var arrow='<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
  document.getElementById('tiles').innerHTML=APPS.map(function(a){
    return '<a class="tile" href="'+a.url+'">'
      +'<span class="ic" style="background:'+a.color+'"><svg viewBox="0 0 24 24">'+a.icon+'</svg></span>'
      +'<span><span class="name">'+a.name+'</span><span class="sub">'+a.sub+'</span></span>'
      +'<span class="arw">'+arrow+'</span></a>';
  }).join('');
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
</script>
</body>
</html>
